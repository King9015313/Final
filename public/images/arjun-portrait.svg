<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Background Office Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#9CA3AF" />
      <stop offset="40%" stopColor="#D1D5DB" />
      <stop offset="100%" stopColor="#6B7280" />
    </linearGradient>
    <!-- Office window / wall soft lighting -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#E5E7EB" stop-opacity="0.9" />
      <stop offset="100%" stopColor="#9CA3AF" stop-opacity="0.4" />
    </linearGradient>
    <!-- Blue shirt gradient (matching blue button-down in photo) -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2563EB" />
      <stop offset="50%" stopColor="#1D4ED8" />
      <stop offset="100%" stopColor="#1E3A8A" />
    </linearGradient>
    <linearGradient id="shirtShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#1E40AF" />
      <stop offset="100%" stopColor="#172554" />
    </linearGradient>
    <!-- Skin tones -->
    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#DCA477" />
      <stop offset="60%" stopColor="#C48E60" />
      <stop offset="100%" stopColor="#A87346" />
    </linearGradient>
    <linearGradient id="skinHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#E6B58D" />
      <stop offset="100%" stopColor="#DCA477" />
    </linearGradient>
    <!-- Hair gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#292524" />
      <stop offset="50%" stopColor="#1C1917" />
      <stop offset="100%" stopColor="#0C0A09" />
    </linearGradient>
  </defs>

  <!-- Background Office Environment -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="180" height="300" fill="url(#windowLight)" opacity="0.6" />
  <!-- Distant window pillar & plant hints -->
  <rect x="180" y="0" width="30" height="400" fill="#4B5563" opacity="0.25" />
  <circle cx="50" cy="220" r="45" fill="#374151" opacity="0.15" />

  <!-- Body / Blue Button-down Shirt -->
  <path d="M70 400 C80 300, 130 260, 200 260 C270 260, 320 300, 330 400 Z" fill="url(#shirtGrad)" />
  <!-- Collar & placket -->
  <path d="M165 260 L200 320 L235 260 Z" fill="url(#shirtShadow)" />
  <path d="M150 256 L195 295 L180 256 Z" fill="#3B82F6" opacity="0.7" />
  <path d="M250 256 L205 295 L220 256 Z" fill="#1D4ED8" />
  <rect x="196" y="315" width="8" height="85" fill="#1E3A8A" opacity="0.6" />
  <!-- Shirt buttons -->
  <circle cx="200" cy="335" r="2.5" fill="#E2E8F0" />
  <circle cx="200" cy="365" r="2.5" fill="#E2E8F0" />

  <!-- Neck -->
  <rect x="176" y="200" width="48" height="70" rx="10" fill="url(#skinBase)" />
  <path d="M176 225 C186 245, 214 245, 224 225 Z" fill="#A87346" opacity="0.4" />

  <!-- Head & Face (Turned slightly 3/4 to the right, looking thoughtfully) -->
  <ellipse cx="202" cy="160" rx="60" ry="72" fill="url(#skinBase)" />
  <!-- Jawline contour -->
  <path d="M148 160 C150 215, 185 235, 215 235 C245 235, 260 210, 262 160 Z" fill="url(#skinBase)" />

  <!-- Forehead highlight -->
  <ellipse cx="205" cy="130" rx="36" ry="24" fill="url(#skinHighlight)" opacity="0.4" />

  <!-- Thick Dark Eyebrows (from photo) -->
  <path d="M162 136 Q178 126 195 134" stroke="#1C1917" stroke-width="5.5" stroke-linecap="round" fill="none" />
  <path d="M215 134 Q232 126 248 136" stroke="#1C1917" stroke-width="5.5" stroke-linecap="round" fill="none" />

  <!-- Thoughtful Eyes looking to the right -->
  <!-- Left Eye -->
  <ellipse cx="178" cy="148" rx="10" ry="6" fill="#F8FAFC" />
  <ellipse cx="181" cy="148" rx="5" ry="5" fill="#1C1917" />
  <circle cx="182.5" cy="146.5" r="1.5" fill="#FFFFFF" />
  <path d="M168 147 Q178 141 188 147" stroke="#1C1917" stroke-width="2" fill="none" />

  <!-- Right Eye -->
  <ellipse cx="232" cy="148" rx="10" ry="6" fill="#F8FAFC" />
  <ellipse cx="235" cy="148" rx="5" ry="5" fill="#1C1917" />
  <circle cx="236.5" cy="146.5" r="1.5" fill="#FFFFFF" />
  <path d="M222 147 Q232 141 242 147" stroke="#1C1917" stroke-width="2" fill="none" />

  <!-- Nose -->
  <path d="M204 142 L208 175 L198 178" stroke="#9A6538" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <ellipse cx="205" cy="178" rx="10" ry="4" fill="#9A6538" opacity="0.3" />

  <!-- Subtle smiling lips -->
  <path d="M188 198 Q206 208 226 198" stroke="#881337" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M192 198 Q206 203 222 198" fill="#F8FAFC" opacity="0.8" />

  <!-- Light beard / shadow along jawline & mustache -->
  <path d="M194 186 Q206 189 218 186" stroke="#1C1917" stroke-width="3" stroke-linecap="round" opacity="0.4" fill="none" />
  <path d="M152 170 C154 220, 185 238, 215 238 C245 238, 258 215, 260 170 C256 205, 240 230, 215 230 C188 230, 156 205, 152 170 Z" fill="#1C1917" opacity="0.28" />

  <!-- Ears -->
  <ellipse cx="142" cy="165" rx="8" ry="16" fill="url(#skinBase)" />
  <ellipse cx="262" cy="165" rx="8" ry="16" fill="url(#skinBase)" />

  <!-- Hair (Neat, modern parted dark hair with slight volume on top) -->
  <path d="M136 150 C132 90, 165 72, 205 72 C245 72, 275 90, 268 150 C258 118, 240 102, 205 102 C170 102, 146 118, 136 150 Z" fill="url(#hairGrad)" />
  <path d="M142 140 C140 100, 170 85, 215 85 C250 85, 266 100, 264 140 C255 115, 235 108, 205 108 C175 108, 150 115, 142 140 Z" fill="#292524" />

  <!-- Hand resting under chin (Pensive pose from photo) -->
  <!-- Forearm & hand coming up from desk -->
  <path d="M160 255 C165 220, 180 205, 195 210 C205 215, 205 235, 190 255 Z" fill="url(#skinBase)" />
  <!-- Thumb & finger touching chin -->
  <ellipse cx="188" cy="216" rx="8" ry="12" fill="#E6B58D" transform="rotate(-25 188 216)" />
  <path d="M182 222 C178 212, 188 206, 194 214" stroke="#9A6538" stroke-width="1.8" fill="none" />
</svg>
